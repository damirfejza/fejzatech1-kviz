<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fejza Tech - Kviz znanja</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #080d1c, #142747);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    background: #111827;
    border: 1px solid #263a59;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 0 30px #0005;
}

.logo {
    text-align: center;
    color: #38bdf8;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
}

.info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 14px;
    color: #cbd5e1;
}

.progress {
    height: 8px;
    background: #263449;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: 0.3s;
}

.question {
    font-size: 22px;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    padding: 15px;
    border: 2px solid #334155;
    background: #1e293b;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    text-align: left;
    transition: 0.2s;
}

.answer:hover {
    border-color: #38bdf8;
    background: #263b56;
}

.answer.correct {
    background: #166534;
    border-color: #22c55e;
}

.answer.wrong {
    background: #991b1b;
    border-color: #ef4444;
}

.answer:disabled {
    cursor: not-allowed;
}

.next {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: #0284c7;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.next:hover {
    background: #0369a1;
}

.result {
    text-align: center;
}

.result h2 {
    color: #38bdf8;
    font-size: 30px;
    margin-bottom: 15px;
}

.result p {
    font-size: 20px;
    margin-bottom: 20px;
}

.hidden {
    display: none;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #64748b;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">FEJZA TECH</div>
    <div class="subtitle">Kviz znanja 💻</div>

    <div id="quiz">

        <div class="info">
            <span id="questionNumber">Pitanje 1/10</span>
            <span id="timer">⏱ 15 s</span>
            <span id="score">Bodovi: 0</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <h2 class="question" id="question">
            Pitanje se učitava...
        </h2>

        <div class="answers" id="answers"></div>

        <button class="next hidden" id="nextButton">
            Sljedeće pitanje →
        </button>

    </div>

    <div class="result hidden" id="result">
        <h2>Kviz završen!</h2>
        <p id="finalScore"></p>
        <p id="message"></p>

        <button class="next" onclick="restartQuiz()">
            Igraj ponovo 🔄
        </button>
    </div>

    <div class="footer">
        © 2026 Fejza Tech
    </div>

</div>

<script>
const questions = [
    {
        question: "Koja komponenta izvršava instrukcije računara?",
        answers: ["RAM", "Procesor (CPU)", "SSD", "Monitor"],
        correct: 1
    },
    {
        question: "Šta je RAM memorija?",
        answers: [
            "Trajna memorija",
            "Grafička kartica",
            "Radna memorija",
            "Procesor"
        ],
        correct: 2
    },
    {
        question: "Koliko bitova ima jedan bajt?",
        answers: ["4", "8", "16", "32"],
        correct: 1
    },
    {
        question: "Koji je programski jezik Python?",
        answers: [
            "Programski jezik",
            "Operativni sistem",
            "Procesor",
            "Internet pregledač"
        ],
        correct: 0
    },
    {
        question: "Šta znači HTML?",
        answers: [
            "High Text Machine Language",
            "HyperText Markup Language",
            "Home Tool Markup Language",
            "Hyper Transfer Main Link"
        ],
        correct: 1
    },
    {
        question: "Koja komponenta prikazuje sliku na monitoru?",
        answers: [
            "RAM",
            "SSD",
            "Grafička kartica",
            "Napajanje"
        ],
        correct: 2
    },
    {
        question: "Koji broj je binarni zapis decimalnog broja 5?",
        answers: ["101", "110", "100", "111"],
        correct: 0
    },
    {
        question: "Koja memorija čuva podatke i kada je računar ugašen?",
        answers: [
            "RAM",
            "Cache",
            "Registar",
            "SSD"
        ],
        correct: 3
    },
    {
        question: "Šta predstavlja CSS?",
        answers: [
            "Jezik za stilizovanje web stranica",
            "Operativni sistem",
            "Bazu podataka",
            "Program za računanje"
        ],
        correct: 0
    },
    {
        question: "Koji uređaj povezuje računar sa internetom?",
        answers: [
            "Tastatura",
            "Mrežna kartica",
            "Zvučnik",
            "Skener"
        ],
        correct: 1
    }
];

let currentQuestion = 0;
let score = 0;
let timeLeft = 15;
let timer;
let answered = false;

const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const nextButton = document.getElementById("nextButton");
const timerElement = document.getElementById("timer");
const scoreElement = document.getElementById("score");
const numberElement = document.getElementById("questionNumber");
const progressBar = document.getElementById("progressBar");

function loadQuestion() {
    clearInterval(timer);
    answered = false;
    timeLeft = 15;

    timerElement.textContent = "⏱ " + timeLeft + " s";
    nextButton.classList.add("hidden");

    const q = questions[currentQuestion];

    questionElement.textContent = q.question;
    numberElement.textContent =
        "Pitanje " + (currentQuestion + 1) +
        "/" + questions.length;

    progressBar.style.width =
        (currentQuestion / questions.length * 100) + "%";

    answersElement.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.className = "answer";
        button.textContent =
            String.fromCharCode(65 + index) + ") " + answer;

        button.onclick = () => checkAnswer(index, button);

        answersElement.appendChild(button);
    });

    startTimer();
}

function startTimer() {
    timer = setInterval(() => {
        timeLeft--;
        timerElement.textContent = "⏱ " + timeLeft + " s";

        if (timeLeft <= 0) {
            clearInterval(timer);
            showCorrectAnswer();
        }
    }, 1000);
}

function checkAnswer(index, button) {
    if (answered) return;

    answered = true;
    clearInterval(timer);

    const correct = questions[currentQuestion].correct;
    const buttons = answersElement.querySelectorAll("button");

    buttons.forEach(btn => btn.disabled = true);

    if (index === correct) {
        button.classList.add("correct");
        score++;
        scoreElement.textContent = "Bodovi: " + score;
    } else {
        button.classList.add("wrong");
        buttons[correct].classList.add("correct");
    }

    nextButton.classList.remove("hidden");
}

function showCorrectAnswer() {
    if (answered) return;

    answered = true;

    const buttons = answersElement.querySelectorAll("button");
    const correct = questions[currentQuestion].correct;

    buttons.forEach(btn => btn.disabled = true);
    buttons[correct].classList.add("correct");

    nextButton.classList.remove("hidden");
}

nextButton.onclick = () => {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
};

function showResult() {
    clearInterval(timer);

    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("finalScore").textContent =
        "Osvojio si " + score + " od " + questions.length + " bodova!";

    let message;

    if (score === 10) {
        message = "Savršeno! Ti si pravi ekspert! 🏆";
    } else if (score >= 7) {
        message = "Odlično znanje! Samo tako nastavi! 🔥";
    } else if (score >= 4) {
        message = "Dobar pokušaj! Možeš još bolje! 💪";
    } else {
        message = "Vježbaj još malo i pokušaj ponovo!";
    }

    document.getElementById("message").textContent = message;
    progressBar.style.width = "100%";
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    scoreElement.textContent = "Bodovi: 0";

    document.getElementById("quiz").classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
